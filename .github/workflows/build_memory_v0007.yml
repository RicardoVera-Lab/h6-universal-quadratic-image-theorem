name: Build institutional memory v0007 delta

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build_memory_v0007.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build memory update package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="CIEC_LAB_INSTITUTIONAL_MEMORY_v0007_20260926"
          mkdir -p "$ROOT/CASE_CLOSE" "$ROOT/CAPABILITY" "$ROOT/ASSETS" "$ROOT/COMMERCIAL" "$ROOT/NEXT_RESEARCH" "$ROOT/PROVENANCE"

          cat > "$ROOT/00_README.md" <<'EOF'
          # CIEC LAB — Institutional Memory v0007 — 26 SEP 2026

          STATUS: ACTIVE_INCREMENT
          CLASSIFICATION: INTERNAL MEMORY / OWNER CONTROLLED
          PARENT_MEMORY: CIEC_LAB_INSTITUTIONAL_MEMORY_v0006_20260925.zip
          UPDATE_SCOPE: H6 mathematical research closure + novelty audit + GitHub publication + portfolio positioning + next-research seed

          ## How to use this package

          This package is an additive institutional-memory increment over v0006. It does not rewrite, invalidate or silently replace prior memory. Use v0006 as the historical base and this v0007 increment as the authoritative delta for events completed on 25–26 SEP 2026.

          Current evidence overrides any older memory statement that conflicts with this delta.

          ## New institutional facts captured

          1. H6 produced a positive computer-assisted theorem within the frozen scope: h(6) >= 25.
          2. Publication hardening closed the internal mathematical chain as CONFIRMED_WITHIN_SCOPE.
          3. The public clean-room verifier and exact witness corpus were published on GitHub and GitHub Actions passed.
          4. Targeted prior-art work found no equivalent statement for h(6)>=25; exhaustive world-priority is not claimed.
          5. The 71-class / zero-extension Threshold-17 line survives only as a secondary potential contribution with partial prior-art overlap.
          6. C7/C8 strengthening work is frozen as H6-II; it is no longer required to justify the positive H6 result.
          7. CIEC LAB now has three public portfolio cases with distinct capability signals: DISCOVER / CHALLENGE / VERIFY.
          8. The next mathematical program should test whether adaptive dependency matching generalizes, starting from theory extraction rather than brute force.

          EOF

          cat > "$ROOT/01_MEMORY_DELTA.json" <<'EOF'
          {
            "memory_version": "v0007",
            "date": "2026-09-26",
            "parent_memory": "CIEC_LAB_INSTITUTIONAL_MEMORY_v0006_20260925.zip",
            "update_type": "ADDITIVE_INCREMENT",
            "owner": "Ricardo Vera / CIEC LAB",
            "primary_case_id": "H6",
            "value_regime": "SCIENTIFIC_R&D",
            "case_state_final": "CLOSED_POSITIVE_RESULT_WITH_STRENGTHENING_FRONTIER_SEPARATED",
            "main_claim": {
              "statement": "Every H subset of F_2^12 with |H| <= 24 is contained in the image of some q:F_2^6 -> F_2^12 whose coordinate functions have algebraic degree <=2.",
              "equivalent_bound": "h(6) >= 25",
              "maturity": "COMPUTER_ASSISTED_THEOREM / CONFIRMED_WITHIN_SCOPE",
              "not_claimed": ["h(6)=25", "h(6)>=26", "exhaustive first-in-history priority", "general theorem for all n"]
            },
            "novelty_state": {
              "h6_lower25": "NO_EQUIVALENT_FOUND_IN_TARGETED_SEARCH",
              "world_priority": "NOT_CERTIFIED",
              "threshold17": "COMPUTER_ASSISTED_SECONDARY_RESULT",
              "71_class_boundary": "PARTIAL_PRIOR_ART_OVERLAP / POTENTIAL_REFINED_CLASSIFICATION"
            },
            "publication_state": {
              "github_repository": "https://github.com/RicardoVera-Lab/h6-universal-quadratic-image-theorem",
              "profile": "https://github.com/RicardoVera-Lab",
              "workflow_verification": "PASS",
              "public_positioning": "CIEC LAB mathematical discovery / computer-assisted theorem"
            },
            "strengthening_frontier": {
              "C7_C8": "FROZEN_AS_H6_II",
              "authority": "UNRESOLVED_STRENGTHENING_ONLY",
              "does_not_block_main_result": true
            },
            "next_program": {
              "working_name": "H-GENERAL / Adaptive Dependency Matching",
              "question": "Does the mechanism allowing D_6=22 to reach 24 arbitrary targets generalize to other n?",
              "first_rule": "NO_BRUTE_FORCE_FIRST",
              "initial_sequence": [
                "separate n=6-specific lemmas from n-general lemmas",
                "derive symbolic general formulation",
                "test small n for pattern",
                "freeze minimal conjecture",
                "only then authorize heavy computation"
              ]
            }
          }
          EOF

          cat > "$ROOT/CASE_CLOSE/H6_CASE_STATE_FINAL.md" <<'EOF'
          # H6 — CASE STATE FINAL

          ## Frozen positive result

          Let q:F_2^6 -> F_2^12 range over maps whose coordinate functions have algebraic degree at most 2.

          The closed result is:

          **Every subset H of F_2^12 with |H| <= 24 is contained in im(q) for at least one such q.**

          Hence:

          **h(6) >= 25.**

          ## Internal closure

          Publication hardening returned:

          **CONFIRMED_WITHIN_SCOPE**

          No internal bridge remained open in the frozen lower-bound proof chain.

          ## Mechanism learned

          The scalar degree-<=2 Boolean function space has dimension

          D_6 = 1 + 6 + C(6,2) = 22.

          The theorem reaches 24 arbitrary targets not by adding two coefficients, but by adaptively choosing preimages so that the two unavoidable evaluation dependencies fall inside dependencies already present in the target set.

          Institutional short name:

          **ADAPTIVE DEPENDENCY MATCHING**

          This is the conceptual asset to carry into the generalization program.

          ## Separation of projects

          H6 lower25 is CLOSED as a positive result.

          C7/C8 remain a separate strengthening frontier (H6-II). They are not required to support h(6)>=25.

          EOF

          cat > "$ROOT/CASE_CLOSE/H6_NOVELTY_AND_BOUNDARIES.md" <<'EOF'
          # H6 — Novelty and Claim Boundaries

          ## h(6)>=25

          Targeted prior-art research searched multiple equivalent languages:
          - quadratic maps over F_2;
          - vectorial Boolean functions;
          - polynomial-image containment;
          - Reed–Muller evaluation/interpolation;
          - coding-theoretic and finite-geometric translations.

          No equivalent of the frozen h(6)>=25 statement was found in the targeted search.

          Correct memory status:

          **NO_EQUIVALENT_FOUND_IN_TARGETED_SEARCH**

          Do not silently upgrade this to an exhaustive historical-priority proof.

          ## Duplicated simplex / Threshold-17 line

          The [14,3,8] duplicated-simplex object itself is known prior art.

          What survived as potentially original is the refined extremal boundary:
          - 71 relevant 16-point classes under the frozen obstruction filter;
          - 71 x 48 = 3408 one-point extensions;
          - zero obstruction-free extensions in the audited route.

          General projective [16,7] code classifications already exist, so the 71 classes must not be marketed as 71 previously unknown [16,7] codes.

          Threshold-17 remains a secondary computer-assisted result; the known direction-cover result does not by itself supply the required seven disjoint pairs.

          EOF

          cat > "$ROOT/CAPABILITY/H6_CAPABILITY_EVIDENCE.md" <<'EOF'
          # Capability Evidence Added by H6

          SOURCE_CLASS: INTERNAL_EXECUTED
          AUTHORITY_CLASS: INTERNAL_RESULT_WITH_PUBLIC_ARTIFACT
          SCOPE: mathematical/computational research under frozen definitions

          ## Evidence supported

          H6 supports capability evidence that CIEC LAB can, within this scope:

          - transform a frontier question across mathematical representations;
          - separate truth, novelty, significance and publication claims;
          - construct a human-readable proof architecture;
          - generate exact finite certificates and witness corpora;
          - perform clean-room hardening;
          - run independent internal reimplementation for several local computations;
          - conduct adversarial proof attacks and exceptional-branch closure;
          - publish a reproducible verification path;
          - stop strengthening work once the positive result no longer depends on it.

          ## Evidence not supported

          H6 does not prove:
          - universal capability across all mathematical domains;
          - external peer-review acceptance;
          - commercial ROI of the theorem itself;
          - successful generalization beyond n=6;
          - that every future AI-assisted proof produced by CIEC LAB is correct.

          ## Institutional delta

          Before H6, the public portfolio mainly demonstrated disciplined stopping and uncertainty control.

          H6 adds a distinct capability signal:

          **POSITIVE DISCOVERY / PROOF CONSTRUCTION**

          EOF

          cat > "$ROOT/ASSETS/H6_ASSET_NOMINATIONS.md" <<'EOF'
          # Asset Nominations from H6

          ## A1 — Adaptive Dependency Matching
          TYPE: conceptual mechanism
          STATE: NOMINATED / REUSE WITH REVALIDATION
          USE: seed for generalization research and analogous interpolation/coding problems
          LIMIT: demonstrated in the frozen n=6 result; no general theorem yet

          ## A2 — Clean-room mathematical hardening protocol
          TYPE: reusable research procedure
          STATE: DEMONSTRATED
          COMPONENTS:
          - frozen claim
          - proof-obligation attack
          - exact arithmetic where authoritative
          - witness/certificate validation
          - exceptional-branch closure
          - independent internal reimplementation
          - explicit external theorem dependency

          ## A3 — Public theorem repository pattern
          TYPE: publication/portfolio asset
          STATE: DEPLOYED
          REPOSITORY: https://github.com/RicardoVera-Lab/h6-universal-quadratic-image-theorem
          FEATURES:
          - theorem statement
          - proof architecture
          - plain-language explanation
          - exact verifier
          - witness corpus
          - GitHub Actions verification
          - status and claim boundaries
          - citation and disclosure boundary

          ## A4 — Scientific-to-commercial translation pattern
          TYPE: positioning asset
          STATE: DEPLOYED
          PRINCIPLE:
          Sell the demonstrated institutional capability, not a speculative application of the theorem.

          EOF

          cat > "$ROOT/COMMERCIAL/PORTFOLIO_STATE_20260926.md" <<'EOF'
          # CIEC LAB — Public Portfolio State — 26 SEP 2026

          ## Positioning

          **CIEC LAB · Strategic Research · Decision Intelligence · High-Consequence R&D**

          **We attack uncertainty before it becomes capital loss.**

          Public principle:

          **Public evidence. Private machinery.**

          ## Three-case portfolio

          ### 01 — DISCOVER
          H6 — Universal Quadratic Image Theorem
          SIGNAL: positive mathematical discovery, proof construction, exact certification, reproducibility

          ### 02 — CHALLENGE
          CS06 — Hypnosis Mechanism Identification
          SIGNAL: mechanism discrimination, uncertainty control, resistance to seductive narratives, bounded stopping

          ### 03 — VERIFY
          CS05 — Topological Overshoot
          SIGNAL: preregistration, frozen analysis, evidence integrity, refusal to substitute weaker evidence

          ## High-ticket commercial translation

          CIEC LAB should not be framed as a generic AI research service.

          The offer is better framed around high-consequence questions where a wrong technical conclusion can become capital loss, strategic lock-in, reputational damage or wasted R&D.

          Public service language now supported by the portfolio includes:
          - frontier R&D;
          - technical due diligence;
          - decision intelligence;
          - scientific intelligence;
          - model and algorithm validation;
          - adversarial research;
          - evidence architecture;
          - go / no-go / redesign support.

          Core commercial line:

          **The deliverable is not more analysis. The deliverable is a decision you can defend.**

          ## GitHub

          Profile:
          https://github.com/RicardoVera-Lab

          Profile README repository:
          https://github.com/RicardoVera-Lab/RicardoVera-Lab

          H6:
          https://github.com/RicardoVera-Lab/h6-universal-quadratic-image-theorem

          CS06:
          https://github.com/RicardoVera-Lab/cs06-hypnosis-mechanism-identification-case-study

          CS05:
          https://github.com/RicardoVera-Lab/cs05-topological-overshoot-case-study

          EOF

          cat > "$ROOT/NEXT_RESEARCH/H_GENERAL_SEED.md" <<'EOF'
          # Next Research Seed — H-GENERAL

          ## Mission question

          H6 showed:

          D_6 = 22

          while universal containment reaches at least:

          24 = D_6 + 2.

          The next research question is not simply “what is h(7)?”

          It is:

          **Is the adaptive dependency-matching mechanism a general phenomenon?**

          ## Mandatory first phase

          NO BRUTE FORCE FIRST.

          1. Rewrite the H6 proof as a dependency graph.
          2. Mark every lemma GENERAL_n or SPECIFIC_n6.
          3. Derive the general evaluation dimension:
             D_n = 1 + n + C(n,2).
          4. Identify the minimal abstract condition that permitted the +2 gain.
          5. Compute or reconstruct small-n behavior only to detect structure.
          6. Freeze the weakest meaningful general conjecture.
          7. Only then decide whether n=7 computation is justified.

          ## Possible outcomes

          All three are scientifically useful:

          A. A general excess above D_n exists.
          B. The excess follows a parity/dimension-dependent pattern.
          C. n=6 is exceptional and the reason can be characterized.

          ## Stop rule

          Do not recreate H6 by scaling enumeration blindly.

          If the next phase cannot isolate a transferable mechanism, stop before launching a combinatorial explosion.

          EOF

          cat > "$ROOT/PROVENANCE/SOURCE_POINTERS.md" <<'EOF'
          # Provenance Pointers

          Base institutional memory:
          - CIEC_LAB_INSTITUTIONAL_MEMORY_v0006_20260925.zip

          H6 research artifacts:
          - OSINTEGA_H6_NOVELTY_PRIORITY_AUDIT_01_2026-09-25.zip
          - OSINTEGA_H6_NOVELTY_CLOSURE_02_2026-09-25.zip
          - ALETHEIA_H6_LOWER25_PUBLICATION_HARDENING_01_20260925.zip
          - CIEC_LAB_H6_QUADRATIC_IMAGE_THEOREM_GITHUB_SOURCE_20260926.zip

          Public canonical repository:
          - https://github.com/RicardoVera-Lab/h6-universal-quadratic-image-theorem

          Public portfolio profile:
          - https://github.com/RicardoVera-Lab

          Authority rule:
          This memory delta summarizes the completed H6 state. For mathematical details, frozen proof/certificate artifacts and the canonical repository outrank prose summaries.

          EOF

          cat > "$ROOT/NEXT_GATE_FOR_FORGE.md" <<'EOF'
          # NEXT GATE FOR FORGE — after Memory v0007

          CURRENT STATE:
          - H6 LOWER25: CLOSED POSITIVE RESULT
          - PUBLICATION: GITHUB LIVE
          - PORTFOLIO: 3 CASES LIVE
          - C7/C8: FROZEN STRENGTHENING FRONTIER
          - GENERALIZATION: NOT YET OPENED

          NEXT AUTHORIZED MOVE:

          Open a separate H-GENERAL research program only after the H6 repository and memory delta are frozen.

          First gate:
          **GENERALITY EXTRACTION BEFORE COMPUTE**

          Required outputs:
          1. proof dependency graph;
          2. GENERAL_n vs SPECIFIC_n6 lemma classification;
          3. candidate abstract adaptive-dependency lemma;
          4. small-n evidence plan;
          5. compute budget only if theory extraction leaves a discriminating experiment.

          Do not reopen H6 lower25 without new contradictory evidence.

          EOF

          (
            cd "$ROOT"
            find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )

      - name: Upload institutional memory delta
        uses: actions/upload-artifact@v4
        with:
          name: CIEC_LAB_INSTITUTIONAL_MEMORY_v0007_20260926
          path: CIEC_LAB_INSTITUTIONAL_MEMORY_v0007_20260926/
          if-no-files-found: error
